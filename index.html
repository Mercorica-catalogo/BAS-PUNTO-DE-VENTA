<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te asesoramos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Color de fondo suave */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: sans-serif;
        }

        #botones{
            display: flex;
            justify-content:space-around;
            padding: 1.5em;
        }

        #botones>:nth-child(even){
            position:relative;
            top:1em;
    
        }

        #contacto{
            position:relative;
            margin-top: 2em;            
        }
        
        .volante-container {
            width: 100%;
            max-width: 600px; /* Evita que se deforme si se abre en computadoras */
          
        }
        /* Se aplica el mismo estilo a imágenes y videos para que sean responsivos */
        .volante-container img, 
        .volante-container video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Configuración de la animación en la imagen */
        .imagen-zumbido {
          display: inline-block;
          /* Llama a la animación 'zumbido', dura 0.15s, es lineal y se repite infinitamente */
          animation: zumbido 0.15s linear infinite; 
        }

        #btn{
            border: none;
            cursor: pointer;
            width: 56vw;
            display:flex; justify-content:center;
            
        }

     

        .boton-enlace:nth-child(1) .imagen-zumbido { animation-delay: 0s; }
        .boton-enlace:nth-child(2) .imagen-zumbido { animation-delay: 0.1s; }
        .boton-enlace:nth-child(3) .imagen-zumbido { animation-delay: 0.2s; }
        .boton-enlace:nth-child(4) .imagen-zumbido { animation-delay: 0.3s; }
        .boton-enlace:nth-child(5) .imagen-zumbido { animation-delay: 0.4s; }
        
        /* Definición de los movimientos del zumbido 
        @keyframes zumbido {
          0% { transform: translate(0, 0) rotate(0deg); }
          20% { transform: translate(-2px, 1px) rotate(-1deg); }
          40% { transform: translate(-1px, -1px) rotate(1deg); }
          60% { transform: translate(2px, 0px) rotate(-0.5deg); }
          80% { transform: translate(1px, 2px) rotate(1deg); }
          100% { transform: translate(0, 0) rotate(0deg); }
        }*/
    </style>
</head>
<body>

    <div class="volante-container">
        <!-- Primera imagen original -->
        <img src="pagina principal.jpg" alt="imagen principal">
         <!-- Botones para las marcas -->
        
        <div id="botones">
            <a href="covergirl.html" class="boton-enlace">
                <img src="covergirl boton.png" alt="Texto descriptivo del botón" style="border: none; cursor: pointer;" class="imagen-zumbido">
            </a>
            
            <a href="maxfactor.html" class="boton-enlace">
                <img src="maxfactor boton.png" alt="Texto descriptivo del botón" style="border: none; cursor: pointer; "class="imagen-zumbido">
            </a>

            <a href="revlon.html" class="imagen-zumbido" class="boton-enlace">
                <img src="revlon boton.png" alt="Texto descriptivo del botón" style="border: none; cursor: pointer;" class="imagen-zumbido">
            </a>

            <a href="almay.html" class="boton-enlace">
                <img src="almay boton.png" alt="Texto descriptivo del botón" style="border: none; cursor: pointer;" class="imagen-zumbido">
            </a>

            <a href="sallyhansen.html" class="boton-enlace">
                <img src="sally boton.png" alt="Texto descriptivo del botón" style="border: none; cursor: pointer;" class="imagen-zumbido">
            </a>
            
        </div>

          
        <!-- Segunda imagen agregada -->

         <div id="contacto">
            <img src="CONTACTANOS.jpg" alt="contactanos" >
              <div style=" display: flex; justify-content: center;">
                 <a href="https://wa.link/htdrv2" target="_blank">
                    <img src="BOTON NUMERO.png" alt="Texto descriptivo del botón" style="border: none; cursor: pointer;" id="btn">
                </a>
            </div>
        </div>

        
    </div>

</body>
</html>
