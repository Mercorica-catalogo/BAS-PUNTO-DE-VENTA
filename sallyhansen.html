<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sally Hansen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Color de fondo suave */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: sans-serif;
        }
        .volante-container {
            width: 100%;
            max-width: 600px; /* Evita que se deforme si se abre en computadoras */
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }
        /* Se aplica el mismo estilo a imágenes y videos para que sean responsivos */
        .volante-container img, 
        .volante-container video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="volante-container">

        <!-- Primera imagen original -->
        <img src="sally.jpg" alt="sally hansen">
        
    </div>

</body>
</html>
